# Configuración para tests de integración
# Usa H2 en memoria (no toca PostgreSQL real)

spring.datasource.url=jdbc:h2:mem:uambite_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test_secret_at_least_32_bytes_for_HMAC_256_algorithm
jwt.expiration=86400000

# Desactivar el fail-fast en tests (los valores ya están aquí)
spring.config.import=
