# =====================================================================
# UAMBite - Configuración base
# Spring importa automáticamente las variables desde el archivo .env
# en la raíz del proyecto (cargado por DotEnvEnvironmentPostProcessor).
#
# Flujo de resolución (mayor a menor prioridad):
#   1. Variables de entorno del SO (export, Docker, CI)
#   2. .env (cargado por DotEnvEnvironmentPostProcessor)
#   3. Defaults vacíos aquí (la app falla al arrancar si no hay valor)
#
# Crea tu .env a partir de la plantilla: cp .env.example .env
# =====================================================================

spring.application.name=UAMBite

server.port=${SERVER_PORT:8090}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# --- Datasource (PostgreSQL) -----------------------------------------
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/uambite}
spring.datasource.username=${DATASOURCE_USERNAME:uambite}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- JWT ------------------------------------------------------------
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
