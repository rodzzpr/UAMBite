# =====================================================================
# UAMBite - Configuración base
# Spring importa automáticamente las variables desde el archivo .env
# en la raíz del proyecto (cargado por DotEnvEnvironmentPostProcessor).
#
# Flujo de resolución (mayor a menor prioridad):
#   1. Variables de entorno del SO (export, Docker, CI)
#   2. .env (cargado por DotEnvEnvironmentPostProcessor)
#   3. Defaults vacíos aquí (la app falla al arrancar si no hay valor)
#
# Crea tu .env a partir de la plantilla: cp .env.example .env
# =====================================================================

spring.application.name=UAMBite

server.port=${SERVER_PORT:8090}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# --- Datasource (PostgreSQL) -----------------------------------------
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/uambite}
spring.datasource.username=${DATASOURCE_USERNAME:uambite}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- JWT ------------------------------------------------------------
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- CORS ------------------------------------------------------------
# Lista separada por comas de orígenes permitidos. Default seguro para dev
# (frontend local). En prod, exportar la var con el dominio real.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# --- Rate limit (login) ----------------------------------------------
# Número máximo de intentos de login permitidos por IP en la ventana.
app.ratelimit.login.max-attempts=${RATELIMIT_LOGIN_MAX_ATTEMPTS:5}
# Tamaño de la ventana en milisegundos.
app.ratelimit.login.window-ms=${RATELIMIT_LOGIN_WINDOW_MS:60000}

# --- Admin bootstrap (opcional) --------------------------------------
# Si al arrancar la app NO existe ningun usuario con rol ADMIN, se crea
# uno automaticamente con estas credenciales. Si ya existe, no hace nada.
# Idempotente: reiniciar la app no duplica admins. La password se hashea
# con BCrypt antes de persistir.
# Recomendacion: en produccion exportar las env vars (APP_ADMIN_*).
app.admin.carnet=${APP_ADMIN_CARNET:ADMIN001}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.nombre=${APP_ADMIN_NOMBRE:Admin}
app.admin.apellido=${APP_ADMIN_APELLIDO:Sistema}
app.admin.correo=${APP_ADMIN_CORREO:admin@uambite.local}

# --- Multipart (subida de imagenes) ----------------------------------
# Limite para los endpoints de imagen (5MB). El validador
# com.example.uambite.util.ImageValidator refuerza este limite.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
